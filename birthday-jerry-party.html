<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday, Jerry Chettayi</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Yellowtail&family=Caveat:wght@500;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff3d9a;--yel:#ffd23f;--cyan:#2de2e6;--org:#ff8a3d;--vio:#b66dff;--ivory:#fff8ee;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;overflow-x:hidden;color:var(--ivory);font:500 1.05rem/1.55 "DM Sans",system-ui,sans-serif;touch-action:manipulation;
background:radial-gradient(70vmax 60vmax at 80% 10%,#ff3d9a55,transparent 60%),radial-gradient(60vmax 60vmax at 0% 100%,#2de2e644,transparent 60%),linear-gradient(160deg,#1a0838,#3a0f5e 50%,#5a1257) #1a0838;background-attachment:fixed}
.beam{position:fixed;top:-12vh;left:var(--x);width:70vmax;height:130vmax;margin-left:-35vmax;z-index:0;pointer-events:none;mix-blend-mode:screen;opacity:.3;transform-origin:50% 0;
background:linear-gradient(to bottom,var(--c),transparent 75%);clip-path:polygon(47% 0,53% 0,100% 100%,0 100%);animation:sweep var(--d) ease-in-out infinite alternate}
@keyframes sweep{from{transform:rotate(-32deg)}to{transform:rotate(32deg)}}
.bk{position:fixed;z-index:0;border-radius:50%;pointer-events:none;background:var(--c);opacity:.22;filter:blur(3px);animation:bk var(--d) ease-in-out infinite alternate}
@keyframes bk{to{transform:translate(var(--dx),-60px) scale(1.4);opacity:.08}}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}#cf{z-index:4}#fx{z-index:6}
#bunting{position:fixed;z-index:5;left:0;top:0;width:100%;height:100px;pointer-events:none;animation:hang 1.4s cubic-bezier(.2,1.3,.4,1) backwards}
@keyframes hang{from{transform:translateY(-110%)}}
.fg{transform-box:fill-box;transform-origin:50% 0;animation:sway 3s ease-in-out var(--d) infinite alternate}@keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
#dots{position:fixed;z-index:10;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;justify-content:center;gap:10px;pointer-events:none}
#dots i{width:8px;height:8px;border-radius:50%;background:#ffffff40;transition:all .5s}#dots i.on{background:var(--yel);transform:scale(1.5);box-shadow:0 0 12px var(--yel)}#dots i.ok{background:var(--pink)}
#snd{position:fixed;z-index:10;right:12px;top:calc(env(safe-area-inset-top,0px) + 56px);width:38px;height:38px;border-radius:50%;border:1px solid #ffffff55;background:#1a083899;color:var(--yel);cursor:pointer;display:grid;place-items:center}
#snd[aria-pressed=false] .wv{display:none}
#hint{position:fixed;z-index:10;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 36px);text-align:center;font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;opacity:0;animation:hint 1.5s 4s forwards;pointer-events:none}@keyframes hint{to{opacity:.7}}
.pg{position:relative;z-index:2;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1.1rem;padding:6.5rem 1.2rem 4rem;transition:opacity .7s,transform .7s,filter .7s}
.pg[hidden]{display:none}.pg:not([hidden]){animation:enter 1s cubic-bezier(.2,.9,.3,1)}.pg.out{opacity:0;transform:scale(.9) rotate(-2deg);filter:blur(8px)}
@keyframes enter{from{opacity:0;transform:translateY(40px) scale(.94)}}
h2{margin:0;font:900 clamp(1.5rem,6.4vw,2.4rem)/1.15 "Unbounded",system-ui,sans-serif;background:linear-gradient(90deg,var(--yel),var(--org),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 3px 0 #0005)}
.s{margin:0;max-width:22rem;opacity:.92}
/* intro poster */
#p0{padding-top:7.5rem;gap:0}
.disco{position:absolute;top:0;left:50%;margin-left:-34px;z-index:7;display:flex;flex-direction:column;align-items:center;transform-origin:top;animation:descend 1.8s cubic-bezier(.2,1.4,.4,1) .4s backwards,swing 5s ease-in-out 2.2s infinite alternate}
.disco::before{content:"";width:2px;height:min(11vh,80px);background:#fffb}
.ball{width:68px;height:68px;border-radius:50%;box-shadow:0 0 50px #fff7,inset -8px -10px 18px #0007;
background:radial-gradient(circle at 30% 26%,#fff,transparent 34%),repeating-linear-gradient(0deg,#0005 0 2px,transparent 2px 9px),repeating-linear-gradient(90deg,#0005 0 2px,transparent 2px 9px),radial-gradient(circle,#dcdcff,#6d6da8);animation:bs 2.4s linear infinite}
@keyframes bs{to{background-position:0 0,0 0,18px 0,0 0}}@keyframes descend{from{transform:translateY(-120%)}}@keyframes swing{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.hp{margin:0;font:400 clamp(3.4rem,18vw,6.6rem)/1 "Yellowtail",cursive;color:var(--yel);transform:rotate(-7deg) scale(.2);opacity:0;transition:transform 1s cubic-bezier(.2,1.8,.4,1),opacity .6s;text-shadow:0 0 30px #ffd23f88,0 4px 0 #0005}
.hp.on{opacity:1;transform:rotate(-7deg)}
.bd{margin:.05em 0 0;font:900 clamp(1.6rem,10.4vw,5rem)/1 "Unbounded",system-ui,sans-serif;white-space:nowrap;text-shadow:0 5px 0 #0006}
.l{display:inline-block;opacity:0}.on .l{animation:drop .9s cubic-bezier(.2,1.6,.4,1) both,wave 2.8s ease-in-out infinite;animation-delay:calc(var(--i)*70ms),calc(1.3s + var(--i)*100ms)}
@keyframes drop{from{opacity:0;transform:translateY(-150px) rotate(-30deg) scale(.4)}to{opacity:1}}@keyframes wave{0%,100%{opacity:1}50%{opacity:1;transform:translateY(-.1em) rotate(-2deg)}}
.nm{margin:.05em 0 0;font:400 120px/1.05 "Yellowtail",cursive;padding:0 .1em;background:linear-gradient(90deg,var(--pink),var(--org),var(--yel),var(--cyan),var(--pink)) 0 0/300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
opacity:0;transform:rotate(-4deg) scale(.1);transition:transform 1.2s cubic-bezier(.2,1.7,.4,1),opacity .6s;filter:drop-shadow(0 0 26px #ff3d9acc) drop-shadow(0 5px 0 #0005)}
.nm.on{opacity:1;animation:shift 4s linear infinite;transform:rotate(-4deg) scale(1)}@keyframes shift{to{background-position:300% 0}}
.sw{width:min(70vw,320px);height:20px;margin-top:-.2rem}.sw path{fill:none;stroke:var(--yel);stroke-width:4;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.2s ease;filter:drop-shadow(0 0 8px var(--yel))}.sw.on path{stroke-dashoffset:0}
.sub{margin:1.4rem 0 0;font-size:.9rem;letter-spacing:.34em;text-transform:uppercase;opacity:0;transition:opacity 1.6s}.sub.on{opacity:.95}
/* sky */
.sky{width:min(90vw,390px);height:auto;overflow:visible}
.st{cursor:pointer}.st .core{fill:var(--yel);transition:fill .5s}.st .glow{fill:var(--yel);opacity:.0;transition:opacity .6s}.st.on .glow{opacity:.45}.st.on .core{fill:#fff}
.nx{fill:none;stroke:var(--pink);stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:ping 1.5s ease-out infinite}@keyframes ping{from{opacity:1;transform:scale(.4)}to{opacity:0;transform:scale(1.7)}}
.cl{fill:none;stroke:var(--cyan);stroke-width:2;stroke-linecap:round;filter:drop-shadow(0 0 5px var(--cyan))}
#crownfill{fill:var(--pink);opacity:0;transition:opacity 2s}.done #crownfill{opacity:.3}
#cname{font:400 30px "Yellowtail",cursive;fill:var(--yel);opacity:0;transition:opacity 2s}.done #cname{opacity:1}
/* toast */
.toast{width:min(88vw,380px);height:auto;touch-action:none;cursor:ew-resize;overflow:visible;user-select:none;-webkit-user-select:none}
.bub{animation:bub var(--d) linear var(--dl) infinite}@keyframes bub{from{transform:translateY(0);opacity:0}15%{opacity:.9}to{transform:translateY(-84px);opacity:0}}
/* seal */
.sealw{position:relative;width:min(60vw,240px);aspect-ratio:1;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none;margin:1rem 0;filter:drop-shadow(0 0 calc(var(--p,0)*44px) var(--pink))}
.sealw.hold{animation:shk .08s linear infinite}@keyframes shk{25%{transform:translate(calc(var(--p,0)*3px),calc(var(--p,0)*-2px))}75%{transform:translate(calc(var(--p,0)*-3px),calc(var(--p,0)*2px))}}
.sh{position:absolute;inset:0;transition:transform 1s cubic-bezier(.3,1.2,.4,1),opacity 1s}.sh svg{width:100%;height:100%;display:block}
.sa{clip-path:inset(0 50% 0 0)}.sb{clip-path:inset(0 0 0 50%)}
.broken .sa{transform:translate(-60px,-16px) rotate(-20deg);opacity:0}.broken .sb{transform:translate(60px,16px) rotate(20deg);opacity:0}
.rg{position:absolute;inset:-14px;width:calc(100% + 28px);height:calc(100% + 28px);pointer-events:none}.rg circle{fill:none;stroke:var(--yel);stroke-width:3;stroke-linecap:round}
/* final */
.t1{font:900 clamp(1.7rem,8.6vw,3.4rem)/1.1 "Unbounded",system-ui,sans-serif;text-shadow:0 4px 0 #0006;margin:0}
.t2{font:400 clamp(4rem,22vw,9rem)/1.02 "Yellowtail",cursive;margin:0;background:linear-gradient(90deg,var(--pink),var(--org),var(--yel),var(--cyan),var(--pink)) 0 0/300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shift 4s linear infinite;filter:drop-shadow(0 0 24px #ff3d9aaa) drop-shadow(0 4px 0 #0005);transform:rotate(-4deg)}
.decree{position:relative;max-width:32rem;width:100%;padding-top:34px;animation:unfold 1.8s cubic-bezier(.2,.9,.3,1) .4s both;transform-origin:top}
@keyframes unfold{from{opacity:0;transform:perspective(900px) rotateX(-85deg) scaleY(.2)}}
.seal{position:absolute;top:0;left:50%;width:68px;height:68px;margin-left:-34px;z-index:2;filter:drop-shadow(0 6px 10px #0007)}.seal svg{width:100%;height:100%;display:block}
.letter{padding:3rem 1.5rem 2rem;border-radius:26px;text-align:center;background:linear-gradient(160deg,#ffffff2b,#ffffff10);border:1px solid #ffffff66;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 0 50px #ff3d9a44,0 30px 60px #0006;font:700 clamp(1.5rem,5vw,2rem)/1.35 "Caveat",cursive}
.letter p{margin:0 0 1.2rem}.letter p:last-child{margin:0}
.dk{font:700 .68rem/1 "Unbounded",system-ui,sans-serif!important;letter-spacing:.3em;text-transform:uppercase;color:var(--yel);margin:0 0 1.5rem!important}
.w{display:inline-block;opacity:0;filter:blur(7px);transform:translateY(.4em);transition:opacity 1s,filter 1s,transform 1s;transition-delay:calc(var(--k)*60ms + 2.2s)}.in .w{opacity:1;filter:none;transform:none}
.sig{color:var(--yel);font-size:1.15em}
.end{margin:0;font:400 clamp(2rem,8vw,3rem)/1.1 "Yellowtail",cursive;color:var(--yel);text-shadow:0 0 24px #ffd23f88;opacity:0;animation:fadein 2s 9s forwards}@keyframes fadein{to{opacity:1}}
.lnk{background:none;border:0;color:var(--ivory);opacity:.6;font:inherit;font-size:.85rem;letter-spacing:.14em;text-decoration:underline;cursor:pointer}
details{width:min(30rem,100%);text-align:left;font-size:.92rem;opacity:.85}summary{cursor:pointer;text-align:center}label{display:block;margin-top:.7rem}
input,textarea{width:100%;margin-top:.25rem;font:inherit;color:var(--ivory);background:#ffffff1a;border:1px solid #ffffff55;border-radius:12px;padding:.6rem .8rem}
:is(input,textarea,summary,button,.st,.sealw):focus-visible{outline:3px solid var(--yel);outline-offset:4px}
@media (prefers-reduced-motion:reduce){.beam,.bk,.fg,.ball,.disco,.nx,.bub,.t2,.nm.on{animation:none}.l{opacity:1}.on .l{animation:none}.hp,.nm,.sw path,.sub{transition:none}.w{transition:none;opacity:1;filter:none;transform:none}.pg:not([hidden]),.decree,#bunting{animation:none}.end{animation:none;opacity:1}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
 <linearGradient id="cw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0b8"/><stop offset="1" stop-color="#f0b942"/></linearGradient>
 <radialGradient id="sg" cx=".35" cy=".3"><stop offset="0" stop-color="#ff7ab8"/><stop offset=".6" stop-color="#d10f6b"/><stop offset="1" stop-color="#7a0a45"/></radialGradient>
 <clipPath id="cp"><path d="M-17 0L-12 108Q0 126 12 108L17 0Z"/></clipPath></defs></svg>
<i class="beam" style="--x:12%;--c:#ff3d9a;--d:7s"></i><i class="beam" style="--x:88%;--c:#2de2e6;--d:9s;animation-delay:-3s"></i><i class="beam" style="--x:50%;--c:#ffd23f;--d:11s;animation-delay:-5s;opacity:.18"></i>
<div id="bokeh"></div>
<canvas id="cf"></canvas><canvas id="fx"></canvas>
<svg id="bunting" aria-hidden="true"></svg>
<div id="dots"></div>
<button id="snd" aria-label="Sound" aria-pressed="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path class="wv" d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg></button>
<p id="hint">Touch the screen once for sound</p>

<main>
<section class="pg" id="p0">
  <div class="disco" aria-hidden="true"><div class="ball"></div></div>
  <p class="hp" id="hp">Happy</p>
  <h1 class="bd" id="bd" aria-label="Birthday"></h1>
  <p class="nm" id="nm"></p>
  <svg class="sw" id="sw" viewBox="0 0 300 20" preserveAspectRatio="none" aria-hidden="true"><path d="M6 12C70 2 170 2 294 9" pathLength="1"/></svg>
  <p class="sub" id="sub">Tonight is all yours</p>
</section>

<section class="pg" id="p1" hidden>
  <h2>Connect the stars</h2>
  <p class="s" id="s1">Touch them in order and reveal the birthday crown.</p>
  <svg class="sky" id="sky" viewBox="0 0 320 280" aria-label="Seven stars forming a crown"></svg>
</section>

<section class="pg" id="p2" hidden>
  <h2>Cheers!</h2>
  <p class="s" id="s2">Drag your finger to bring the glasses together.</p>
  <svg class="toast" id="toast" viewBox="0 0 320 250" aria-label="Two champagne flutes"></svg>
</section>

<section class="pg" id="p3" hidden>
  <h2>Break the seal</h2>
  <p class="s" id="s3">Press and hold to open your birthday decree.</p>
  <div class="sealw" id="sealw" role="button" tabindex="0" aria-label="Press and hold to break the seal">
    <div class="sh sa" id="sa"></div><div class="sh sb" id="sb"></div>
    <svg class="rg" viewBox="0 0 240 240"><circle id="rc" cx="120" cy="120" r="116" stroke-dasharray="729" stroke-dashoffset="729" transform="rotate(-90 120 120)"/></svg>
  </div>
</section>

<section class="pg" id="p4" hidden>
  <div><h1 class="t1" id="t1"></h1><p class="t2" id="t2"></p></div>
  <div class="decree"><div class="seal" id="seal5"></div><div class="letter" id="letter"></div></div>
  <p class="end" id="end"></p>
  <button class="lnk" id="again">Watch again</button>
  <details id="edit" hidden><summary>Personalize this page</summary>
    <label>Their name<input id="inName" maxlength="24"></label>
    <label>Your name<input id="inFrom" maxlength="24"></label>
    <label>Your message<textarea id="inMsg" rows="5" maxlength="700" placeholder="Separate paragraphs with a blank line"></textarea></label>
  </details>
</section>
</main>

<script>
(()=>{
const $=s=>document.querySelector(s),R=Math.random,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,SC=reduce?.35:1,NS='http://www.w3.org/2000/svg';
const q=new URLSearchParams(location.search);
let name=(q.get('name')||'Jerry Chettayi').slice(0,24),from=(q.get('from')||'Antappan').slice(0,24),msg=(q.get('msg')||'').slice(0,700),tt;
const COL=['#ff3d9a','#ffd23f','#2de2e6','#ff8a3d','#b66dff','#ffffff'];
const defMsg=n=>`Be it known, across every kingdom and every group chat, that today belongs to ${n}.\n\nLet there be cake without limit, laughter without end, and not a single worry before midnight.\n\nTo the finest brother and best friend a person could be granted: thank you for the loyalty, the honesty and every ordinary day you made worth remembering.\n\nMay this year bring you everything you were always too generous to ask for.`;
const ini=()=>(name||'J')[0].toUpperCase();
const pages=[...document.querySelectorAll('.pg')];let cur=0,adv={};
pages.forEach(()=>$('#dots').appendChild(document.createElement('i')));const dots=[...$('#dots').children];
const mark=()=>dots.forEach((d,i)=>d.className=i<cur?'ok':i===cur?'on':'');mark();
// ---------- sound (browsers block audio until the first touch)
let ac,master,touched=false,sndOn=false,tStamp=0;
function A(){if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=0;master.connect(ac.destination);pad()}return ac}
function pad(){[110,164.81,220,277.18].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain(),lp=ac.createBiquadFilter();o.type='sine';o.frequency.value=f;lp.type='lowpass';lp.frequency.value=700;g.gain.value=.022/(i+1)**.3;o.connect(lp);lp.connect(g);g.connect(master);o.start()})}
function setSnd(v){try{A();ac.resume();sndOn=v;master.gain.cancelScheduledValues(ac.currentTime);master.gain.linearRampToValueAtTime(v?.9:0,ac.currentTime+.6)}catch(e){}$('#snd').setAttribute('aria-pressed',v);$('#hint').style.display='none'}
function bell(f,t=0,d=1.8,v=.16){if(!sndOn)return;const n=ac.currentTime+t,o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain(),g2=ac.createGain();o.frequency.value=f;o2.frequency.value=f*2.76;g2.gain.value=.3;g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v,n+.006);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);o2.connect(g2);g2.connect(g);g.connect(master);o.start(n);o2.start(n);o.stop(n+d+.1);o2.stop(n+d+.1)}
function noise(d,v,fc){if(!sndOn)return;const n=ac.currentTime,b=ac.createBuffer(1,ac.sampleRate*d,ac.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=(R()*2-1)*(1-i/x.length);const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=fc;g.gain.value=v;s.connect(f);f.connect(g);g.connect(master);s.start(n)}
const pop=()=>{noise(.18,.3,3500);bell(1568,0,.6,.1)};
function melody(){const N=[[392,.75],[392,.25],[440,1],[392,1],[523,1],[494,2],[392,.75],[392,.25],[440,1],[392,1],[587,1],[523,2],[392,.75],[392,.25],[784,1],[659,1],[523,1],[494,1],[440,1],[698,.75],[698,.25],[659,1],[523,1],[587,1],[523,2]];let t=.2;N.forEach(([f,b])=>{bell(f,t,1.5,.2);t+=b*.55})}
addEventListener('pointerdown',()=>{if(touched)return;touched=true;tStamp=Date.now();setSnd(true)},{passive:true});
$('#snd').onclick=()=>{if(Date.now()-tStamp<500)return;touched=true;setSnd(!sndOn)};
// ---------- decor: bunting + bokeh
function bunting(){const w=innerWidth,s=$('#bunting');s.setAttribute('viewBox',`0 0 ${w} 100`);let h=`<path d="M-10 4Q${w/2} 70 ${w+10} 4" fill="none" stroke="#ffffffaa" stroke-width="1.5"/>`;const n=Math.max(8,Math.round(w/40));
 for(let i=0;i<n;i++){const t=(i+.5)/n,u=1-t,x=u*u*-10+2*u*t*w/2+t*t*(w+10),y=u*u*4+2*u*t*70+t*t*4,dx=2*u*(w/2+10)+2*t*(w/2+10),dy=2*u*66-2*t*66,an=Math.atan2(dy,dx)*180/Math.PI;
  h+=`<g transform="translate(${x},${y}) rotate(${an})"><polygon class="fg" points="-15,0 15,0 0,40" fill="${COL[i%5]}" style="--d:${-R()*3}s"/></g>`}s.innerHTML=h}
bunting();
for(let i=0;i<14;i++){const e=document.createElement('i');e.className='bk';const s=30+R()*90;e.style.cssText=`left:${R()*100}%;top:${R()*100}%;width:${s}px;height:${s}px;--c:${COL[i%5]};--d:${6+R()*8}s;--dx:${(R()-.5)*80}px`;$('#bokeh').appendChild(e)}
// ---------- canvases: confetti + fireworks
const cf=$('#cf'),fx=$('#fx'),b=cf.getContext('2d'),a=fx.getContext('2d');let W,H,C=[],P=[],K=[];
function size(){const D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;[cf,fx].forEach(c=>{c.width=W*D;c.height=H*D});b.setTransform(D,0,0,D,0,0);a.setTransform(D,0,0,D,0,0)}size();
function confetti(x,y,n){for(let i=0;i<n;i++){const an=-Math.PI/2+(R()-.5)*2.4,sp=5+R()*12;C.push({x,y,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp,r:R()*6,vr:(R()-.5)*.4,w:6+R()*7,h:3+R()*5,c:COL[R()*6|0],l:1})}}
function rain(n){if(C.length>420)return;for(let i=0;i<n;i++)C.push({x:R()*W,y:-12,vx:(R()-.5)*2,vy:1+R()*2,g:.07,r:R()*6,vr:(R()-.5)*.3,w:6+R()*7,h:3+R()*5,c:COL[R()*6|0],l:1})}

const segs=S.map((p,i)=>i?`<path class="cl" id="sg${i}" d="M${S[i-1][0]} ${S[i-1][1]}L${p[0]} ${p[1]}" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" style="transition:stroke-dashoffset .8s ease"/>`:'').join('')+`<path class="cl" id="sg7" d="M${S[6][0]} ${S[6][1]}L${S[0][0]} ${S[0][1]}" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" style="transition:stroke-dashoffset 1s ease"/>`;

 if(si<7){const n=$('#nx');n.setAttribute('cx',S[si][0]);n.setAttribute('cy',S[si][1])}else{$('#nx').remove();skyDone=true;$('#sg7').style.strokeDashoffset=0;setTimeout(()=>{sky.classList.add('done');$('#s1').textContent='Every birthday king needs a crown.';const r2=sky.getBoundingClientRect();burst(r2.left+r2.width/2,r2.top+r2.height*.4,100);rocket();confetti(r2.left+r2.width/2,r2.top+r2.height*.5,90);bell(1319,0,2.4,.14);pop()},900);next(1,3200)}}

 a.globalCompositeOperation='destination-out';a.fillStyle='rgba(0,0,0,.24)';a.fillRect(0,0,W,H);a.globalCompositeOperation='lighter';
 K=K.filter(r=>{r.y+=r.vy;r.vy*=.99;a.globalAlpha=.9;a.fillStyle='#fff3c0';a.fillRect(r.x,r.y,2.2,9);if(r.y<=r.ty){burst(r.x,r.y);return false}return true});
 P=P.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.986;p.vy=p.vy*.986+.04;p.l-=p.d;if(p.l<=0)return false;a.globalAlpha=p.l;a.fillStyle=p.c;a.beginPath();a.arc(p.x,p.y,p.s,0,7);a.fill();return true});a.globalAlpha=1;
 b.clearRect(0,0,W,H);
 C=C.filter(c=>{c.x+=c.vx;c.y+=c.vy;c.vx*=.985;c.vy=c.vy*.97+(c.g??.22);c.r+=c.vr;if(c.g===undefined)c.l-=.004;if(c.y>H+20||c.l<=0)return false;b.save();b.translate(c.x,c.y);b.rotate(c.r);b.scale(1,Math.abs(Math.cos(c.r*1.7))+.15);b.fillStyle=c.c;b.fillRect(-c.w/2,-c.h/2,c.w,c.h);b.restore();return true});
 if(cur===2&&!tDone){if(tAuto)tv=Math.min(1,tv+dt/1400);else if(!drag)tv=Math.max(0,tv-dt/500);applyT();if(tv>=.97)clink()}
